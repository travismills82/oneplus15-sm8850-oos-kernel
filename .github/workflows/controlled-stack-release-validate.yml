name: Controlled stack release validation

on:
  pull_request:
    paths:
      - "docs/releases/**"
      - "docs/controlled-stack-release-process.md"
      - "tools/*controlled-stack-release*.py"
      - ".github/workflows/controlled-stack-release-validate.yml"
  push:
    paths:
      - "docs/releases/**"
      - "docs/controlled-stack-release-process.md"
      - "tools/*controlled-stack-release*.py"
      - ".github/workflows/controlled-stack-release-validate.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to verify, or leave blank for metadata only
        required: false
        type: string

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all committed release records
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for manifest in docs/releases/*/release-manifest.json; do
            [ -f "$manifest" ] || continue
            found=1
            release_dir="$(dirname "$manifest")"
            python3 tools/verify-controlled-stack-release.py \
              --manifest "$manifest" \
              --signoff "$release_dir/validation-signoff.json" \
              --allow-symbolic-release-commit
          done
          [ "$found" -eq 1 ]

  published-assets:
    # Route full controlled-stack packages through their manifest verifier and
    # firmware-specific boot-only packages through the boot-only ZIP verifier.
    if: >-
      (github.event_name == 'release' &&
       contains(join(github.event.release.assets.*.name, ','), '-TWRP.zip')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0
      - name: Download published assets
        run: gh release download "$RELEASE_TAG" --dir release-assets
      - name: Verify published release identity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find release-assets -maxdepth 1 -type f -name '*-TWRP.zip' -print)
          [ "${#zips[@]}" -eq 1 ]
          commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if [ -f release-assets/release-manifest.json ]; then
            python3 tools/verify-controlled-stack-release.py \
              --manifest release-assets/release-manifest.json \
              --signoff release-assets/validation-signoff.json \
              --zip "${zips[0]}" \
              --sha256sums release-assets/SHA256SUMS \
              --release-commit "$commit" \
              --repo .
          else
            [ -f release-assets/boot.img ]
            [ -f release-assets/boot.img.sha256 ]
            [ -f release-assets/SHA256SUMS ]
            zip_name="$(basename "${zips[0]}")"
            [ -f "release-assets/$zip_name.sha256" ]
            mapfile -t assets < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
            mapfile -t expected_assets < <(printf '%s\n' \
              SHA256SUMS boot.img boot.img.sha256 "$zip_name" "$zip_name.sha256" | sort)
            diff -u <(printf '%s\n' "${expected_assets[@]}") \
              <(printf '%s\n' "${assets[@]}")
            (
              cd release-assets
              sha256sum -c SHA256SUMS
              sha256sum -c boot.img.sha256
              sha256sum -c "$zip_name.sha256"
            )
            kernel_info="$(unzip -p "${zips[0]}" kernel-info.txt)"
            read_info() {
              key="$1"
              value="$(printf '%s\n' "$kernel_info" | sed -n "s/^${key}=//p")"
              [ "$(printf '%s\n' "$kernel_info" | grep -c "^${key}=")" -eq 1 ]
              printf '%s' "$value"
            }
            firmware="$(read_info firmware)"
            build_display_id="$(read_info build_display_id)"
            kernel_release="$(read_info kernel_release)"
            source_commit="$(read_info source_commit)"
            stock_system_dlkm_sha256="$(read_info stock_system_dlkm_sha256)"
            [ "$(read_info release_tag)" = "$RELEASE_TAG" ]
            case "$RELEASE_TAG" in
              oos16.0.10.500-ack-*)
                [ "$firmware" = 'OxygenOS 16.0.10.500(EX01)' ]
                [ "$build_display_id" = 'CPH2747_16.0.10.500(EX01)' ]
                [ "$stock_system_dlkm_sha256" = \
                  '18f530dcb0e46dc81ede00e18ac4e9b39faf6564fb067f04af9a912d87fd6dd7' ]
                ;;
              *)
                printf 'Unsupported boot-only release profile: %s\n' "$RELEASE_TAG" >&2
                exit 1
                ;;
            esac
            git merge-base --is-ancestor "$source_commit" "$commit"
            case "$kernel_release" in
              *"-g${source_commit%????????????????????????????}"*) ;;
              *)
                printf 'Kernel release does not identify source commit %s: %s\n' \
                  "$source_commit" "$kernel_release" >&2
                exit 1
                ;;
            esac
            python3 tools/validate-boot-only-twrp-zip.py "${zips[0]}" \
              --boot release-assets/boot.img \
              --release-tag "$RELEASE_TAG" \
              --firmware "$firmware" \
              --build-display-id "$build_display_id" \
              --kernel-release "$kernel_release" \
              --source-commit "$source_commit" \
              --stock-system-dlkm-sha256 "$stock_system_dlkm_sha256"
          fi
